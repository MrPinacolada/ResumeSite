name: Build
on:
  push:
    branches:
      - nuxt-rebase
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  sonarcloud:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      
      - name: Run ESLint with output
        run: npx eslint . --format checkstyle --output-file eslint-report.xml || true


      - name: SonarCloud Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          run: npx sonarqube-scanner -Dsonar.javascript.eslint.reportPaths=eslint-report.xml
